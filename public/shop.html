<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쇼핑몰 상품 페이지 (데모)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin: 20px 0; }
    .shop img { border-radius: 10px; width: 100%; }
    .shop h1 { margin: 4px 0 8px; font-size: 24px; }
    .demo-note { background: #fff7e6; color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 20px; }
    @media (max-width: 640px) { .shop { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="./">맞춤 상품 추천</a></div></header>
  <main class="wrap">
    <p class="demo-note">사내 시연용 데모 쇼핑몰 페이지입니다. 실제 쇼핑몰 링크는 관리 화면에서 상품별로 바꿀 수 있습니다.</p>
    <div id="shop"></div>
  </main>
  <script src="js/common.js"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      const box = document.getElementById('shop');
      try {
        const p = await api(`/api/products/${encodeURIComponent(id)}`);
        document.title = `${p.name} - 쇼핑몰 (데모)`;
        box.innerHTML = `<section class="shop">
          <img src="${esc(p.image)}" alt="">
          <div>
            <span class="category">${esc(p.category)}</span>
            <h1>${esc(p.name)}</h1>
            <p class="muted">${esc(p.recommend_text)}</p>
            <div class="price">${p.sale_price != null
              ? `<span class="rate">${discountRate(p)}%</span><strong>${won(p.sale_price)}원</strong><del>${won(p.price)}원</del>`
              : `<strong>${won(p.price)}원</strong>`}</div>
            <p><button class="btn btn-primary" disabled>장바구니 담기 (데모)</button></p>
          </div>
        </section>`;
      } catch (e) {
        box.innerHTML = '<p class="empty">상품을 찾을 수 없거나 품절된 상품입니다.</p>';
      }
    })();
  </script>
</body>
</html>
