<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맞춤 상품 추천</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./">맞춤 상품 추천</a>
      <div class="topbar-actions">
        <a id="adminLink" class="btn btn-ghost btn-sm" href="admin.html" hidden>관리 화면</a>
        <button id="staffToggle" class="switch" type="button" role="switch" aria-checked="false">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span>상담원 모드</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="추천 조건">
      <div class="filter-row">
        <span class="filter-label">성별</span>
        <div class="chips" data-filter="gender"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">연령대</span>
        <div class="chips" data-filter="age"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">용도</span>
        <div class="chips" data-filter="purpose"></div>
      </div>
      <p class="filter-hint">선물용은 <b>받는 분</b>의 성별·연령대를 골라 주세요.</p>
    </section>

    <div class="result-head">
      <h1 id="resultTitle">전체 추천 상품</h1>
      <span id="resultMeta" class="muted"></span>
    </div>
    <div id="staffBanner" class="staff-banner" hidden>
      상담원 모드 · 품절 상품 포함, 재고·내부 메모·판매 데이터가 표시됩니다.
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="empty" class="empty" hidden>조건에 맞는 상품이 없습니다. 조건을 바꿔 보세요.</p>
  </main>

  <dialog id="pinDialog" class="dialog">
    <form method="dialog">
      <h2>상담원 모드</h2>
      <p class="muted">PIN 4자리를 입력하세요.</p>
      <input type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" class="pin-input" aria-label="PIN">
      <p class="pin-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-cancel>취소</button>
        <button type="submit" class="btn btn-primary">확인</button>
      </div>
    </form>
  </dialog>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
